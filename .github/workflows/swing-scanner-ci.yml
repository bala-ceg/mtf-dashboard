name: Swing Scanner CI

on:
  push:
    branches:
      - feature/nifty-total-market-swing-scanner
    paths:
      - "backend/**"
      - "etl/**"
      - "sql/**"
      - "frontend/**"
      - ".github/workflows/swing-scanner-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "etl/**"
      - "sql/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q backend etl config.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
