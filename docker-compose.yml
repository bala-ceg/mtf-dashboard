version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mtf_postgres
    environment:
      POSTGRES_DB: mtf_db
      POSTGRES_USER: bseetharaman
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bseetharaman -d mtf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtf_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mtf_db
      DB_USER: bseetharaman
      DB_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./sql:/app/sql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtf_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
